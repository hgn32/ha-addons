<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nintendo Music Bridge</title>
<style>
  :root { color-scheme: light dark; --bg:#fafafa; --fg:#212121; --border:#ddd; --ok:#2e7d32; --ng:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#e1e1e1; --border:#333; } }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui, sans-serif; }
  main { max-width:1320px; margin:0 auto; padding:12px 16px; }
  #bar { display:flex; gap:16px; flex-wrap:wrap; font-size:.9rem; margin-bottom:8px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
  iframe { width:100%; aspect-ratio:1280/800; border:1px solid var(--border); border-radius:6px; background:#000; }
</style>
</head>
<body>
<main>
  <div id="bar"><span id="chrome">Chrome: 確認中…</span><span id="sink">音声出力: 確認中…</span></div>
  <iframe src="novnc/vnc.html?autoconnect=1&resize=scale&reconnect=1&reconnect_delay=1000&path=websockify" title="Chrome の画面"></iframe>
  <p style="font-size:.85rem">画面内で Nintendo Music にログインし、曲を再生してください。音声は VBAN で Music Assistant へ送られます（MA の「VBAN Receiver」で受信）。</p>
</main>
<script>
async function poll() {
  try {
    const s = await (await fetch("api/status", { cache: "no-store" })).json();
    const c = document.getElementById("chrome"), k = document.getElementById("sink");
    c.textContent = "Chrome: " + (s.chrome ? "起動中" : "停止（自動で起動し直します）");
    c.className = s.chrome ? "ok" : "ng";
    k.textContent = "音声出力: " + (s.sink === "RUNNING" ? "再生中（VBAN 送信中）" : s.sink ? "待機中（" + s.sink + "）" : "見つかりません");
    k.className = s.sink === "RUNNING" ? "ok" : s.sink ? "" : "ng";
  } catch {}
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
