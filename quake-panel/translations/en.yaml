configuration:
  notify_home_assistant:
    name: Notify Home Assistant
    description: Send earthquake early warnings, quake reports and tsunami forecasts to Home Assistant as events and sensors (binary_sensor.quake_panel_eew and others). This add-on does not filter by intensity or area - write those conditions in your automation instead.
  kmoni_layer:
    name: Map metric
    description: Which Kyoshin Monitor metric to draw. The default (max acceleration) reacts 1-2 seconds earlier, which suits catching a quake as early as possible, but it picks up traffic and machinery so the whole map flickers all the time. Choose realtime intensity for a quiet screen — it stays almost entirely blue when nothing is happening. Each device can override this from the panel's settings.
  kmoni_idle_frame_interval_sec:
    name: Frame interval, idle (seconds)
    description: How often the Kyoshin Monitor image is fetched. Default 1 second. Set 2 to halve the outbound traffic.
  kmoni_active_frame_interval_sec:
    name: Frame interval, during EEW (seconds)
    description: Fetch interval while an earthquake early warning is active. Keeping 1 second is recommended.
  log_level:
    name: Log level
    description: Set to debug only when you need to trace the add-on's behaviour.
