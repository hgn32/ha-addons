configuration:
  notify_home_assistant:
    name: Notify Home Assistant
    description: Fires events and updates sensors in Home Assistant (binary_sensor.quake_panel_eew and friends) so automations can react — for example switching the dashboard when an earthquake early warning arrives. Turning this off does not disable the panel's "use the home location from HA" button.
  notify_min_intensity:
    name: Notify only above this intensity
    description: Earthquakes below this JMA intensity are not reported to Home Assistant, so automations do not fire for every small quake in the country. Early warnings are judged by their forecast maximum intensity. Cancellation reports are always sent regardless of this setting, otherwise an automation could never turn its lights back off. The quake list shown on the panel is filtered separately.
  notify_prefectures:
    name: Notify only for these prefectures
    description: Only report earthquakes, early warnings and tsunami forecasts that concern the selected prefectures. Use "Add" to pick as many as you like; select none for the whole country. Matching differs per report — quake reports use the prefecture of the observation points, early warnings the regions with a forecast intensity, and tsunami forecasts the tsunami areas belonging to that prefecture (including wide areas such as 東北地方太平洋沿岸 and bays such as 有明・八代海). This is the only setting that filters tsunami — the "regions" setting below does not.
  notify_areas:
    name: Notify only for these regions
    description: A finer alternative to prefectures. Choose from the JMA regions used in quake reports and early warnings (188 nationwide). Use "Add" to pick as many as you like. If both prefectures and regions are set, a quake matching either one is reported. Select none to disable this condition. Does not apply to tsunami forecasts, which use a different set of areas.
  kmoni_layer:
    name: Map metric
    description: Which Kyoshin Monitor metric to draw. The default (max acceleration) reacts 1-2 seconds earlier, which suits catching a quake as early as possible, but it picks up traffic and machinery so the whole map flickers all the time. Choose realtime intensity for a quiet screen — it stays almost entirely blue when nothing is happening. Each device can override this from the panel's settings.
  kmoni_idle_frame_interval_sec:
    name: Frame interval, idle (seconds)
    description: How often the Kyoshin Monitor image is fetched. Default 1 second. Set 2 to halve the outbound traffic.
  kmoni_active_frame_interval_sec:
    name: Frame interval, during EEW (seconds)
    description: Fetch interval while an earthquake early warning is active. Keeping 1 second is recommended.
  log_level:
    name: Log level
    description: Set to debug only when you need to trace the add-on's behaviour.
