configuration:
  notify_home_assistant:
    name: Home Assistant へ通知する
    description: 緊急地震速報などを Home Assistant のイベントとセンサーに流します（binary_sensor.quake_panel_eew など）。オートメーションでダッシュボードを切り替える、といった使い方ができます。無効にしても、パネルの設定にある「HA の自宅位置を使う」は使えます。
  notify_min_intensity:
    name: 通知する地震（最大震度）
    description: この震度に満たない地震は Home Assistant へ通知しません。全国の小さな地震まで通知すると、オートメーションが毎日走ってしまうため絞れるようにしています。緊急地震速報は予想最大震度で判定します。取消報だけは絞り込みに関わらず通知します（通知しないと、オートメーションで点けた照明を消せなくなるため）。パネルの画面に出る地震は別に絞れます。
  notify_prefectures:
    name: 通知する範囲（都道府県）
    description: 選んだ都道府県に関わる地震・緊急地震速報・津波予報だけを Home Assistant へ通知します。「追加」で何県でも選べます。ひとつも選ばなければ全国です。判定は情報ごとに違い、地震情報は観測点の都道府県、緊急地震速報は予想震度が出ている地域、津波予報はその県に関わる津波予報区（「東北地方太平洋沿岸」のような広域の区や「有明・八代海」のような湾も含みます）で見ます。津波を絞れるのはこの項目だけです（下の「地域」は津波には効きません）。
  notify_areas:
    name: 通知する範囲（地域・都道府県より細かい）
    description: 都道府県より細かく指定したいときに使います。気象庁が地震情報・緊急地震速報で使う「地域」（細分区域・全国188区）から選びます。「追加」で何区でも選べます。都道府県と両方を指定した場合は、どちらかに当てはまれば通知します。ひとつも選ばなければ、この条件は使いません。津波予報には効きません（津波は別の区分で発表されるためです）。
  kmoni_layer:
    name: 地図に出す指標
    description: 強震モニタのどの指標を地図に出すか。既定の「最大加速度」は揺れの検知が 1〜2 秒早く、地震をいち早く捉えたい用途に向きます。その代わり交通や機械の振動を拾って平常時から全国がざわつきます。静かな画面が好みなら「リアルタイム震度」にしてください（平常時はほぼ真っ青です）。端末ごとにパネルの設定で変えることもできます。
  kmoni_idle_frame_interval_sec:
    name: 画像の取得間隔（平常時・秒）
    description: 強震モニタの画像を何秒おきに取りに行くか。既定は 1 秒。外部への通信量を半分にしたいときは 2 にしてください。
  kmoni_active_frame_interval_sec:
    name: 画像の取得間隔（緊急地震速報の発表中・秒）
    description: 緊急地震速報が出ている間の取得間隔。1 秒のままを推奨します。
  log_level:
    name: ログレベル
    description: 動作を詳しく追いたいときだけ debug にしてください。
