configuration:
  notify_home_assistant:
    name: Home Assistant へ通知する
    description: 緊急地震速報などを Home Assistant のイベントとセンサーに流します（binary_sensor.quake_panel_eew など）。オートメーションでダッシュボードを切り替える、といった使い方ができます。無効にしても、パネルの設定にある「HA の自宅位置を使う」は使えます。
  kmoni_layer:
    name: 地図に出す指標
    description: 強震モニタのどの指標を地図に出すか。既定の「リアルタイム震度」は平常時ほぼ真っ青で、常時表示に向きます。「最大加速度」は揺れの検知が 1〜2 秒早い代わりに、交通や機械の振動を拾って平常時から全国がざわつきます。端末ごとにパネルの設定で変えることもできます。
  kmoni_idle_frame_interval_sec:
    name: 画像の取得間隔（平常時・秒）
    description: 強震モニタの画像を何秒おきに取りに行くか。既定は 1 秒。外部への通信量を半分にしたいときは 2 にしてください。
  kmoni_active_frame_interval_sec:
    name: 画像の取得間隔（緊急地震速報の発表中・秒）
    description: 緊急地震速報が出ている間の取得間隔。1 秒のままを推奨します。
  log_level:
    name: ログレベル
    description: 動作を詳しく追いたいときだけ debug にしてください。
